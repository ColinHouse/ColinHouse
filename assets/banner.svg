.word{font:700 84px Georgia,'Times New Roman',Times,serif;letter-spacing:-.01em}
.ipa{font:19px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;opacity:.9}
.gloss{font:italic 17px Georgia,'Times New Roman',Times,serif;opacity:.8}
.head{fill:#f3ece5;animation:sweep 7s linear infinite}
@keyframes glow{0%,9%,100%{opacity:.8}3%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0);opacity:0}2%{opacity:.55}41%{opacity:.55}43.4%{transform:translateX(441px);opacity:0}100%{transform:translateX(441px);opacity:0}}
@media (prefers-reduced-motion:reduce){.col,.ph,.head{animation:none}.head{opacity:0}}
</style>
