<svg xmlns="http://www.w3.org/2000/svg" width="412" height="318" viewBox="0 0 412 318" role="img" aria-label="Sprig: A statically typed JVM language for people and coding agents: less to guess, easier to review.">
<title>Sprig: A statically typed JVM language for people and coding agents: less to guess, easier to review.</title>
<style>
:root{--surface:#fbf9f5;--panel:#f1ede4;--border:#e2dbce;--ink:#1f2a44;--text:#414a63;--muted:#7d8497;--blue:#3b58a8;--sand:#a8753f;--tile:#ffffff;--sky0:#4463b8;--sky1:#324d98}@media (prefers-color-scheme:dark){:root{--surface:#131a2c;--panel:#19223b;--border:#283355;--ink:#f0eadf;--text:#c3cadb;--muted:#8790a7;--blue:#8fa8f0;--sand:#dbb488;--tile:#222d4d;--sky0:#34509c;--sky1:#243a78}}
.card{fill:var(--surface);stroke:var(--border)}
.art{fill:var(--panel)}
.rule{stroke:var(--border)}
.kicker{font:9.5px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.12em;fill:var(--sand)}
.name{font:700 21px Georgia,'Times New Roman',Times,serif;fill:var(--ink)}
.go{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.en{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--text)}
.zh{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--muted)}
.meta{font:11.5px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--text)}.meta tspan{fill:var(--muted)}
.code{font:11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;fill:var(--text);white-space:pre}
.k{fill:var(--blue);font-weight:700}.t{fill:var(--ink)}.p{fill:var(--muted)}
.fade0{stop-color:var(--panel);stop-opacity:0}.fade1{stop-color:var(--panel)}
</style>
