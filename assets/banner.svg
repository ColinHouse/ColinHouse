<svg xmlns="http://www.w3.org/2000/svg" width="846" height="270" viewBox="0 0 846 270" role="img" aria-label="Syrinx. /ˈsɪrɪŋks/, with a stylized mel spectrogram of the word">
<title>Syrinx. /ˈsɪrɪŋks/, with a stylized mel spectrogram of the word</title>
<style>
:root{--surface:#fbf9f5;--panel:#f1ede4;--border:#e2dbce;--ink:#1f2a44;--text:#414a63;--muted:#7d8497;--blue:#3b58a8;--sand:#a8753f;--tile:#ffffff;--sky0:#4463b8;--sky1:#324d98}@media (prefers-color-scheme:dark){:root{--surface:#131a2c;--panel:#19223b;--border:#283355;--ink:#f0eadf;--text:#c3cadb;--muted:#8790a7;--blue:#8fa8f0;--sand:#dbb488;--tile:#222d4d;--sky0:#34509c;--sky1:#243a78}}
text{fill:#f3ece5}
.col{fill:#f3ece5;opacity:.8;animation:glow 7s linear infinite}
.ph{font:500 14px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;opacity:.72;text-anchor:middle;animation:glow 7s linear infinite}
