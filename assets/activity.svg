<style>
:root{--surface:#fbf9f5;--panel:#f1ede4;--border:#e2dbce;--ink:#1f2a44;--text:#414a63;--muted:#7d8497;--blue:#3b58a8;--sand:#a8753f;--tile:#ffffff;--sky0:#4463b8;--sky1:#324d98}@media (prefers-color-scheme:dark){:root{--surface:#131a2c;--panel:#19223b;--border:#283355;--ink:#f0eadf;--text:#c3cadb;--muted:#8790a7;--blue:#8fa8f0;--sand:#dbb488;--tile:#222d4d;--sky0:#34509c;--sky1:#243a78}}
.card{fill:var(--surface);stroke:var(--border)}
.kicker{font:10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;fill:var(--muted)}
.big{font:700 54px Georgia,'Times New Roman',Times,serif;fill:var(--ink)}
.cap{font:13px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--text)}
.zh{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--muted)}
.stat{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,'Noto Sans',sans-serif;fill:var(--muted)}.stat tspan{font-weight:600;fill:var(--ink)}
.axis{stroke:var(--border);stroke-dasharray:1 5}
.month text,.note{font:9px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.08em;fill:var(--muted)}
.month path{stroke:var(--border)}
.note{fill:var(--sand)}
.rest{fill:var(--muted);opacity:.55}
.bar{fill:var(--blue);animation:play 9s linear infinite}
@keyframes play{0%,5%,100%{fill:var(--blue)}1.6%{fill:var(--sand)}}
@media (prefers-reduced-motion:reduce){.bar{animation:none}}
</style>
